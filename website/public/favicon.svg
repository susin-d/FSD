<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254">
  <defs>
    <!-- Right upright: bright at top, darkening toward the ribbon -->
    <linearGradient id="blueRight" x1="0.3" y1="0" x2="0.6" y2="1">
      <stop offset="0"    stop-color="#1384FF"/>
      <stop offset="0.45" stop-color="#0B4FE0"/>
      <stop offset="1"    stop-color="#0526B0"/>
    </linearGradient>

    <!-- Left upright: bright at bottom, darker at the top-right near ribbon -->
    <linearGradient id="blueLeft" x1="0.9" y1="0.1" x2="0.2" y2="0.7">
      <stop offset="0" stop-color="#0638B8"/>
      <stop offset="1" stop-color="#0A70FF"/>
    </linearGradient>

    <linearGradient id="yellow" x1="0.15" y1="0" x2="0.7" y2="1">
      <stop offset="0"    stop-color="#FFDF0E"/>
      <stop offset="0.5"  stop-color="#FFC810"/>
      <stop offset="1"    stop-color="#FFA008"/>
    </linearGradient>
  </defs>


  <!-- Left blue upright (top hidden under the ribbon) -->
  <rect x="333" y="450" width="208" height="470" rx="104" fill="url(#blueLeft)"/>

  <!-- Right blue upright (bottom hidden under the ribbon) -->
  <rect x="710" y="318" width="211" height="560" rx="105" fill="url(#blueRight)"/>

  <!-- Yellow diagonal ribbon -->
  <path fill="url(#yellow)" d="
    M333 425
    C333 365 375 320 432 320
    C478 320 508 340 540 373
    L710 558
    L800 658
    C830 692 855 712 880 712
    C905 712 921 692 921 668
    L921 822
    C921 878 880 920 825 920
    C790 920 765 905 740 880
    C700 840 600 720 541 660
    C510 630 485 600 462 573
    C440 550 420 541 396 541
    C360 541 333 565 333 595
    Z"/>
</svg>